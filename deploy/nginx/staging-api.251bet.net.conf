# Ubuntu + nginx reverse proxy for the staging Docker Compose backend (127.0.0.1:3002).
# Domain: staging-api.251bet.net
#
# DNS: A-record staging-api.251bet.net → same VPS as api.251bet.net
#
# Install on the VPS:
#   sudo cp deploy/nginx/staging-api.251bet.net.conf /etc/nginx/sites-available/staging-api.251bet.net.conf
#   sudo ln -sf /etc/nginx/sites-available/staging-api.251bet.net.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS (Let's Encrypt) — after DNS resolves:
#   sudo certbot --nginx -d staging-api.251bet.net
#
# Verify:
#   curl -sS https://staging-api.251bet.net/health

server {
    listen 80;
    listen [::]:80;
    server_name staging-api.251bet.net;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
